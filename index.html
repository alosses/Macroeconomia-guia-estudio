<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa Macro Internacional</title>
<style>
:root{
  --bg:#f5f4ef;--card:#ffffff;--ink:#1d2229;--muted:#69707a;--line:#e3e1d9;
  --accent:#1f5f99;--accent-soft:#e3eef8;--ok:#2e7d4f;--ok-soft:#e2f2e8;
  --warn:#a8660d;--warn-soft:#fbf0dc;--bad:#b83227;--bad-soft:#fbe5e2;--extra:#6b4fa0;--extra-soft:#efe9f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181c;--card:#1e2228;--ink:#e8e9eb;--muted:#9aa1ab;--line:#30353d;
    --accent:#6ea8dc;--accent-soft:#1c2f42;--ok:#5cbf85;--ok-soft:#1c3327;
    --warn:#e0a548;--warn-soft:#3a2d17;--bad:#ef7a6e;--bad-soft:#3d1f1c;--extra:#b39ae0;--extra-soft:#2c2540;
  }
}
:root[data-theme="dark"]{
  --bg:#15181c;--card:#1e2228;--ink:#e8e9eb;--muted:#9aa1ab;--line:#30353d;
  --accent:#6ea8dc;--accent-soft:#1c2f42;--ok:#5cbf85;--ok-soft:#1c3327;
  --warn:#e0a548;--warn-soft:#3a2d17;--bad:#ef7a6e;--bad-soft:#3d1f1c;--extra:#b39ae0;--extra-soft:#2c2540;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:4px 0 2px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.ok>i{background:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.big{font-size:28px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;border-left:4px solid}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:8px 0;overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:20px;font-size:14px;cursor:pointer}
nav.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.task{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;margin-top:2px;flex:0 0 auto;accent-color:var(--ok);cursor:pointer}
.task .t{font-weight:600}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.note{font-size:13px;color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.A{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.B{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.C{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.late{background:var(--bad);color:#fff;border-color:transparent}
.tag.today{background:var(--accent);color:#fff;border-color:transparent}
.tag.grp{background:var(--extra-soft);color:var(--extra);border-color:transparent}
/* mapa */
.map{position:relative;padding-left:34px}
.map:before{content:"";position:absolute;left:14px;top:10px;bottom:10px;width:3px;background:var(--line);border-radius:2px}
.mod{position:relative;margin:0 0 14px}
.node{position:absolute;left:-34px;top:14px;width:31px;height:31px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.mod.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.mod.current .node{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 5px var(--accent-soft)}
.mod .card{margin:0;cursor:default}
.mod.current .card{border-color:var(--accent);border-width:2px}
.mhead{display:flex;gap:10px;align-items:center;cursor:pointer}
.mhead .ttl{font-weight:700}
.chev{transition:transform .2s;color:var(--muted)}
.mod.open .chev{transform:rotate(90deg)}
.mbody{display:none;margin-top:10px}
.mod.open .mbody{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.small{padding:3px 8px;font-size:12px}
.extra{background:var(--extra-soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.extra h3{color:var(--extra);margin-top:0}
.locked{opacity:.55}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
textarea{min-height:70px}
.guide{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.day{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.day .d{width:92px;flex:0 0 auto;font-size:13px;color:var(--muted)}
.day.istoday .d{color:var(--accent);font-weight:700}
.day.class{background:var(--accent-soft);border-radius:8px;padding:8px}
.week{font-weight:700;margin-top:14px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.ci{font-size:13px;padding:2px 0}
.ci.done{text-decoration:line-through;color:var(--muted)}
.hrs{font-size:12px;color:var(--muted);white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:560px){.stats{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.day .d{width:74px}}
.hidden{display:none}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
</style>
</head>

const KEY = "mapa-macro-intl-2026-v1";
let S = {done:{},extra:{},group:0,custom:[],notes:{},open:{},unlock:{},hideDone:false};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ============ FECHAS ============ */
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
const qs = new URLSearchParams(location.search);
const TODAY = qs.get("hoy") || ymd(new Date());
function toDate(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(s,n){const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function diff(a,b){return Math.round((toDate(b)-toDate(a))/86400000);}
function fmt(s,long){return toDate(s).toLocaleDateString("es-CL",long?{weekday:"long",day:"numeric",month:"long"}:{weekday:"short",day:"numeric",month:"short"});}
function rel(s){const n=diff(TODAY,s);if(n===0)return"hoy";if(n===1)return"mañana";if(n===-1)return"ayer";return n>0?"en "+n+" días":"hace "+(-n)+" días";}

/* ============ TAREAS ============ */
function baseTasks(){
  const out=[];
  MODS.forEach(m=>m.tasks.forEach(t=>out.push({id:t[0],type:t[1],title:t[2],ref:t[3],h:t[4],plan:t[5],prio:t[6]||"",note:t[7]||"",mod:m.id})));
  return out;
}
function groupTasks(){
  if(!S.group)return[];
  const m=MODS.find(x=>x.group===+S.group); if(!m)return[];
  const g=[["leer",-12,"Lectura profunda del caso y datos clave",3],["reparto",-10,"Reunión de grupo: repartir secciones",1],["analisis",-7,"Conectar el caso con el modelo del módulo (gráficos, datos actualizados)",4],["slides",-4,"Armar slides para 45 minutos",4],["ensayo",-1,"Ensayo cronometrado + 3 preguntas para la discusión",1.5]];
  return g.map(x=>({id:"g"+S.group+"-"+x[0],type:"grupo",title:"Tu presentación: "+x[2],ref:"Grupo "+S.group,h:x[3],plan:addDays(m.date,x[1]),prio:"A",note:"",mod:m.id}));
}
function customTasks(){return S.custom.map(c=>Object.assign({type:"custom",prio:"",note:"",ref:""},c));}
function allTasks(){return baseTasks().concat(groupTasks(),customTasks());}
function modTasks(id){return allTasks().filter(t=>t.mod===id);}
function prog(list){const tot=list.reduce((a,t)=>a+t.h,0);const d=list.filter(t=>S.done[t.id]).reduce((a,t)=>a+t.h,0);return{tot,d,pct:tot?Math.round(100*d/tot):0,n:list.length,nd:list.filter(t=>S.done[t.id]).length};}
function nextMod(){return MODS.find(m=>m.date>=TODAY);}
function h(n){return (Math.round(n*10)/10).toString().replace(".",",")+" h";}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function taskRow(t,opts={}){
  const done=!!S.done[t.id];
  const late=!done&&t.type!=="clase"&&t.plan<TODAY;
  const tags=[];
  if(late)tags.push('<span class="tag late">atrasada</span>');
  else if(!done&&t.plan===TODAY)tags.push('<span class="tag today">hoy</span>');
  if(t.prio)tags.push('<span class="tag '+t.prio+'">'+PRIO[t.prio]+'</span>');
  if(t.type==="grupo")tags.push('<span class="tag grp">tu grupo</span>');
  const meta=[TYPE[t.type]];
  if(t.ref&&t.ref!=="—")meta.push(esc(t.ref));
  meta.push(h(t.h));
  meta.push((t.type==="clase"?"":"plan: ")+fmt(t.plan));
  if(opts.mod)meta.push("Módulo "+t.mod);
  return '<div class="task'+(done?" done":"")+'"><input type="checkbox" data-id="'+t.id+'"'+(done?" checked":"")+' aria-label="Completar">'+
    '<div class="grow"><div class="t">'+esc(t.title)+'</div><div class="meta">'+meta.map(x=>"<span>"+x+"</span>").join("·")+" "+tags.join(" ")+'</div>'+
    (t.note?'<div class="note">'+esc(t.note)+'</div>':"")+
    (t.type==="custom"?' <button class="btn small" data-del="'+t.id+'">eliminar</button>':"")+'</div></div>';
}

/* ============ HOY ============ */
function renderHoy(){
  const all=allTasks(), study=all.filter(t=>t.type!=="clase");
  const P=prog(all), nm=nextMod();
  let html='<div class="card"><div class="row"><div class="grow"><div class="sub">Progreso total del curso</div><div class="big">'+P.pct+'%</div></div>'+
    '<div class="sub" style="text-align:right">'+fmt(TODAY,true)+'</div></div>'+
    '<div class="bar ok"><i style="width:'+P.pct+'%"></i></div>'+
    '<div class="stats"><div class="stat"><b>'+P.nd+'/'+P.n+'</b><span>tareas</span></div><div class="stat"><b>'+h(P.d)+'</b><span>de '+h(P.tot)+'</span></div>'+
    '<div class="stat"><b>'+MODS.filter(m=>prog(modTasks(m.id)).pct===100).length+'/6</b><span>módulos al 100%</span></div></div></div>';

  // alertas
  const alerts=[];
  const late=study.filter(t=>!S.done[t.id]&&t.plan<TODAY);
  if(late.length)alerts.push(["bad","Tienes <b>"+late.length+"</b> tarea(s) atrasada(s) ("+h(late.reduce((a,t)=>a+t.h,0))+"). Aparecen primero en la lista de abajo."]);
  if(nm){
    const dl=diff(TODAY,nm.date);
    const rem=modTasks(nm.id).filter(t=>!S.done[t.id]&&t.type!=="clase"&&t.type!=="post");
    const remH=rem.reduce((a,t)=>a+t.h,0);
    const perDay=remH/Math.max(1,dl);
    alerts.push([dl<=2?"warn":"info","Próxima clase: <b>Módulo "+nm.id+" · "+nm.title+"</b> — "+fmt(nm.date,true)+" ("+rel(nm.date)+"), "+nm.when+", sala <b>"+nm.room+"</b>. Te faltan "+h(remH)+" de preparación."]);
    if(remH>0&&perDay>4)alerts.push(["bad","<b>Modo prioridad:</b> necesitarías ~"+h(perDay)+" por día para llegar. Haz primero las tareas <b>A</b> (sirven para el quiz y la clase), después B y C. Lo que no alcances queda como repaso post-clase. Igual es obligatorio terminarlo."]);
    if(nm.warn)alerts.push(["warn",nm.warn]);
    if(S.group&&nm.group===+S.group)alerts.push(["warn","<b>¡Este módulo presenta tu grupo!</b> 45 minutos de exposición + discusión."]);
  } else alerts.push(["ok","Terminaron las clases del programa. Revisa si hay evaluaciones finales y agrégalas en Ajustes."]);
  if(!S.group)alerts.push(["info","Indica tu número de grupo en <b>Ajustes</b> para que la guía programe la preparación de tu presentación."]);
  html+=alerts.map(a=>'<div class="alert '+a[0]+'">'+a[1]+'</div>').join("");

  // hoy
  const classToday=MODS.find(m=>m.date===TODAY);
  const ord={A:0,B:1,C:2,"":1};
  const todo=study.filter(t=>!S.done[t.id]&&t.plan<=TODAY).sort((a,b)=>(a.plan<TODAY?0:1)-(b.plan<TODAY?0:1)||ord[a.prio]-ord[b.prio]||a.plan.localeCompare(b.plan));
  html+='<div class="card"><h2>Qué estudiar hoy</h2>';
  if(classToday)html+='<div class="alert info">🎓 Hoy hay clase: Módulo '+classToday.id+', '+classToday.when+', sala '+classToday.room+'. Marca cada sesión al terminarla (en el Mapa).</div>';
  if(todo.length){html+='<div class="sub">Tiempo estimado: '+h(todo.reduce((a,t)=>a+t.h,0))+'</div>'+todo.map(t=>taskRow(t,{mod:1})).join("");}
  else html+='<p>Estás al día. 🎉 Puedes adelantar lo próximo o, si el módulo está al 100%, ir a <b>Ir más allá</b>.</p>';
  html+='</div>';

  const up=study.filter(t=>!S.done[t.id]&&t.plan>TODAY).sort((a,b)=>a.plan.localeCompare(b.plan)).slice(0,4);
  if(up.length)html+='<div class="card"><h2>Lo que viene</h2>'+up.map(t=>taskRow(t,{mod:1})).join("")+'</div>';

  html+='<div class="card"><h2>Cómo estudiar cada tipo de tarea</h2>'+
   '<div class="guide"><b>📖 Lectura (capítulo):</b> 1) 10 min hojeando títulos, figuras y conclusiones. 2) Lectura con lápiz, rehaciendo cada derivación. 3) Cierra con 5 ideas clave + 1 gráfico dibujado de memoria (esto prepara el quiz).</div>'+
   '<div class="guide"><b>📁 Caso HBS:</b> lee las preguntas guía antes del caso, subraya datos (CC/PIB, tipo de cambio, deuda), y lleva 1–2 preguntas para la discusión.</div>'+
   '<div class="guide"><b>✏️ Quiz (15 min, al inicio de cada módulo):</b> repasa tus 5 ideas clave por lectura y las definiciones. No leas material nuevo el día antes.</div>'+
   '<div class="guide"><b>🔁 Repaso post-clase:</b> dentro de 48 h, resume la clase en 1 página y anota dudas para el profesor.</div></div>';
  document.getElementById("tab-hoy").innerHTML=html;
}

function extraBlock(m,pct){
  const unlocked=pct===100||S.unlock[m.id];
  let s='<div class="extra"><h3>🚀 Ir más allá (optativo) · Módulo '+m.id+'</h3>';
  if(!unlocked)s+='<div class="sub">🔒 Se desbloquea cuando el módulo obligatorio esté al 100% ('+pct+'% ahora). <button class="btn small" data-unlock="'+m.id+'">ver igual</button></div>';
  else s+=m.beyond.map((b,i)=>{const id="x"+m.id+"-"+i,d=!!S.extra[id];return'<div class="task'+(d?" done":"")+'"><input type="checkbox" data-x="'+id+'"'+(d?" checked":"")+'><div><div class="t">'+esc(b[0])+'</div><div class="note">'+esc(b[1])+'</div></div></div>';}).join("")+
    (pct<100?'<div class="alert warn">Recuerda: primero completa el 100% obligatorio de este módulo.</div>':"");
  return s+'</div>';
}

/* ============ CALENDARIO ============ */
function renderCal(){
  const all=allTasks().sort((a,b)=>a.plan.localeCompare(b.plan));
  const byDay={};all.forEach(t=>(byDay[t.plan]=byDay[t.plan]||[]).push(t));
  let html='<div class="card"><div class="row"><h2 class="grow" style="margin:0">Plan día a día</h2><label class="sub"><input type="checkbox" id="hideDone"'+(S.hideDone?" checked":"")+'> ocultar hechas</label></div>'+
    '<div class="sub">Horas estimadas por día. Los días con clase aparecen destacados.</div>';
  let lastWeek="";
  Object.keys(byDay).sort().forEach(d=>{
    let list=byDay[d];if(S.hideDone)list=list.filter(t=>!S.done[t.id]);if(!list.length)return;
    const dt=toDate(d),mon=new Date(dt);mon.setDate(dt.getDate()-((dt.getDay()+6)%7));const wk=ymd(mon);
    if(wk!==lastWeek){html+='<div class="week">Semana del '+fmt(wk)+'</div>';lastWeek=wk;}
    const isClass=MODS.find(m=>m.date===d);
    const hrs=list.filter(t=>t.type!=="clase").reduce((a,t)=>a+t.h,0);
    html+='<div class="day'+(d===TODAY?" istoday":"")+(isClass?" class":"")+'"><div class="d">'+fmt(d)+(d===TODAY?"<br>HOY":"")+'</div><div class="grow">'+
      (isClass?'<div class="ci"><b>🎓 Módulo '+isClass.id+' · '+isClass.when+' · '+isClass.room+'</b></div>':"")+
      list.filter(t=>t.type!=="clase").map(t=>'<div class="ci'+(S.done[t.id]?" done":"")+'">'+(t.prio?'<span class="tag '+t.prio+'">'+t.prio+'</span> ':"")+esc(t.title)+' <span class="hrs">'+h(t.h)+'</span></div>').join("")+
      '</div><div class="hrs">'+(hrs?h(hrs):"")+'</div></div>';
  });
  html+='</div>';
  document.getElementById("tab-cal").innerHTML=html;
}

  else if(t.dataset.x){S.extra[t.dataset.x]=t.checked;save();renderAll();}
  else if(t.id==="hideDone"){S.hideDone=t.checked;save();renderCal();}
  else if(t.id==="grp"){S.group=+t.value;save();renderAll();}
  else if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();renderAll();alert("Progreso importado.");}catch(err){alert("Archivo no válido.");}};r.readAsText(t.files[0]);}
});
document.addEventListener("input",e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;save();}});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-toggle],[data-all],[data-none],[data-unlock],[data-del],#cAdd,#exp,#rst,#themeBtn,nav.tabs button");
  if(!t)return;
  if(t.dataset.tab){document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b===t));document.querySelectorAll("section").forEach(s=>s.classList.toggle("hidden",s.id!=="tab-"+t.dataset.tab));window.scrollTo(0,0);return;}
  if(t.dataset.toggle){const id=t.dataset.toggle,el=t.closest(".mod");const o=!el.classList.contains("open");el.classList.toggle("open",o);S.open[id]=o;save();return;}
  if(t.dataset.all){modTasks(+t.dataset.all).forEach(x=>S.done[x.id]=true);save();renderAll();return;}
  if(t.dataset.none){modTasks(+t.dataset.none).forEach(x=>S.done[x.id]=false);save();renderAll();return;}
  if(t.dataset.unlock){S.unlock[t.dataset.unlock]=true;save();renderAll();return;}

  if(t.id==="cAdd"){const ti=document.getElementById("cT").value.trim();if(!ti)return;S.custom.push({id:"c"+Date.now(),title:ti,plan:document.getElementById("cD").value||TODAY,h:+document.getElementById("cH").value||0,mod:+document.getElementById("cM").value});save();renderAll();alert("Tarea agregada.");return;}
  if(t.id==="exp"){const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="progreso-macro-"+TODAY+".json";a.click();return;}
  if(t.id==="rst"){if(confirm("¿Borrar todo el progreso de este navegador?")){S={done:{},extra:{},group:0,custom:[],notes:{},open:{},unlock:{},hideDone:false};save();renderAll();}return;}
  if(t.id==="themeBtn"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme);}catch(err){}}
});
try{const th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}
renderAll();
</script>
