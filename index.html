<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ruta Macro">
<title>Ruta Macro Internacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f4f8; --card:#ffffff; --ink:#16233a; --ink2:#4d5a70; --faint:#8a94a6; --rule:#dfe3ea;
  --route:#2347d6; --route-soft:#e6ebfc; --done:#12946b; --done-soft:#dff3eb;
  --signal:#f2a900; --signal-soft:#fff4d6; --danger:#d33f49; --danger-soft:#fde8ea;
  --violet:#7a4cc2; --violet-soft:#efe8fa;
  --shadow:0 1px 2px rgba(22,35,58,.06),0 8px 24px rgba(22,35,58,.08);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1626; --card:#18223a; --ink:#eef1f7; --ink2:#b4bdd0; --faint:#7f8aa3; --rule:#2a3552;
    --route:#7d98ff; --route-soft:#1f2b52; --done:#38c28f; --done-soft:#143a2e;
    --signal:#ffc23d; --signal-soft:#3a2f12; --danger:#ff6b74; --danger-soft:#3d1a20;
    --violet:#b893f2; --violet-soft:#2b2245; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1626; --card:#18223a; --ink:#eef1f7; --ink2:#b4bdd0; --faint:#7f8aa3; --rule:#2a3552;
  --route:#7d98ff; --route-soft:#1f2b52; --done:#38c28f; --done-soft:#143a2e;
  --signal:#ffc23d; --signal-soft:#3a2f12; --danger:#ff6b74; --danger-soft:#3d1a20;
  --violet:#b893f2; --violet-soft:#2b2245; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--route);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.brand{font-family:var(--display);font-weight:800;font-size:19px}
.brand small{display:block;font:400 13px var(--body);color:var(--faint);margin-top:1px}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:19px}

/* ---------- la línea (elemento firma) ---------- */
.line{position:relative;display:flex;margin:14px -4px 6px;padding-bottom:4px}
.line .track,.line .fill{position:absolute;top:19px;height:6px;border-radius:3px;left:calc(100%/12);}
.line .track{right:calc(100%/12);background:var(--rule)}
.line .fill{background:var(--done);transition:width .5s ease}
.stn{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;min-width:0}
.stn .dot{width:44px;height:44px;border-radius:50%;background:var(--card);border:5px solid var(--rule);display:grid;place-items:center;font:800 16px var(--display);color:var(--faint);transition:transform .2s}
.stn.done .dot{background:var(--done);border-color:var(--done);color:#fff}
.stn.cur .dot{background:var(--signal);border-color:var(--card);color:#16233a;box-shadow:0 0 0 4px var(--signal);transform:scale(1.08)}
.stn .nm{font-size:11px;line-height:1.2;text-align:center;color:var(--ink2);font-weight:700;max-width:60px;hyphens:manual;overflow-wrap:break-word}
.stn .dt{font-size:11px;color:var(--faint)}
.stn.cur .nm{color:var(--ink)}
.here{position:absolute;top:-16px;font-size:11px;font-weight:700;background:var(--ink);color:var(--paper);padding:1px 7px;border-radius:9px;white-space:nowrap}

/* ---------- reloj de la próxima clase ---------- */
.next{display:flex;align-items:center;gap:12px;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:var(--route-soft)}
.next .big{font:800 26px/1 var(--display);color:var(--route);white-space:nowrap}
.next .txt{font-size:14px;color:var(--ink2);line-height:1.35}
.next .txt b{color:var(--ink)}

/* ---------- avisos ---------- */
.notice{margin:10px 0;padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.notice .ic{font-size:18px;line-height:1.2}
.notice.danger{background:var(--danger-soft)}
.notice.signal{background:var(--signal-soft)}
.notice.done{background:var(--done-soft)}
.notice .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:20px;background:var(--card);font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}

/* ---------- tarjeta de foco ---------- */
.focus{margin:16px 0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px 18px;position:relative;overflow:hidden}
.focus:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tcol,var(--route))}
.frow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--faint)}
.kind{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--tcol,var(--route))}
.focus h2{font-size:23px;line-height:1.2;margin:10px 0 12px;font-weight:700}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fact{background:var(--paper);border-radius:8px;padding:4px 9px;font-size:13.5px;color:var(--ink2)}
.fact.late{background:var(--danger);color:#fff;font-weight:700}
.why{font-size:15px;color:var(--ink2);margin:0 0 12px}
.how{list-style:none;margin:0 0 14px;padding:0;counter-reset:h}
.how li{counter-increment:h;position:relative;padding:7px 0 7px 36px;font-size:15px;border-top:1px dashed var(--rule)}
.how li:first-child{border-top:0}
.how li:before{content:counter(h);position:absolute;left:0;top:6px;width:24px;height:24px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 13px var(--display);color:var(--ink2)}
.guide{background:var(--violet-soft);border-radius:12px;padding:10px 12px;font-size:14.5px;margin-bottom:14px}
.guide b{color:var(--violet)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;background:var(--done);color:#fff;font:700 17px var(--body);box-shadow:0 4px 14px rgba(18,148,107,.3);transition:transform .1s}
.cta:active{transform:scale(.98)}
.cta.blue{background:var(--route);box-shadow:0 4px 14px rgba(35,71,214,.28)}
.ghost{display:block;width:100%;margin-top:8px;padding:10px;color:var(--faint);font-size:14.5px;border-radius:12px}

/* ---------- lista del día ---------- */
.sec{margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3{font-size:18px}
.sec span{font-size:13.5px;color:var(--faint)}
.load{height:8px;border-radius:4px;background:var(--rule);overflow:hidden;margin:4px 0 6px}
.load i{display:block;height:100%;background:var(--route);border-radius:4px}
.load.over i{background:var(--danger)}
.rowt{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--rule)}
.rowt:first-of-type{border-top:0}
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--rule);display:grid;place-items:center;font-weight:800;color:#fff;transition:background .2s,border-color .2s}
.chk:hover{border-color:var(--done)}
.done .chk,.chk.on{background:var(--done);border-color:var(--done)}
.rowt .tt{font-weight:700;font-size:15px;line-height:1.3}
.rowt .mm{font-size:13px;color:var(--faint)}
.rowt.done .tt{text-decoration:line-through;color:var(--faint)}
.rowt .grow{flex:1;min-width:0}

/* ---------- ruta ---------- */
.mod{background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.mh{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px}
.mh .num{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 17px var(--display);background:var(--paper);color:var(--ink2)}
.mod.done .num{background:var(--done);color:#fff}
.mod.cur .num{background:var(--signal);color:#16233a}
.mh .t{font:700 16.5px/1.25 var(--display)}
.mh .s{font-size:13px;color:var(--faint);margin-top:2px}
.mh .bar{height:6px;border-radius:3px;background:var(--rule);margin-top:7px;overflow:hidden}
.mh .bar i{display:block;height:100%;background:var(--done)}
.mh .chev{margin-left:auto;color:var(--faint);font-size:20px;transition:transform .2s}
.mod.open .chev{transform:rotate(90deg)}
.mb{display:none;padding:0 14px 16px}
.mod.open .mb{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.phase{margin:16px 0 4px;font:700 14px var(--display);color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.phase span{font:400 13px var(--body);color:var(--faint)}
.steps{position:relative}
.step{display:flex;gap:12px;position:relative;padding:8px 0}
.step:not(:last-child):after{content:"";position:absolute;left:14px;top:40px;bottom:-8px;width:2.5px;background:var(--rule)}
.step.done:not(:last-child):after{background:var(--done)}
.step .chk{background:var(--card);color:var(--ink2);font:700 13px var(--display)}
.step.done .chk{color:#fff}
.sb{flex:1;text-align:left;min-width:0}
.sb .tt{font-weight:700;font-size:15px;line-height:1.3}
.step.done .sb .tt{color:var(--faint);text-decoration:line-through}
.sb .mm{font-size:13px;color:var(--faint)}
.sx{display:none;margin-top:8px;font-size:14px;color:var(--ink2)}
.step.exp .sx{display:block}
.sx ol{margin:6px 0;padding-left:20px}
details.more{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
details.more summary{cursor:pointer;font-weight:700;font-size:14.5px;color:var(--ink2);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:"▸ ";color:var(--faint)}
details.more[open] summary:before{content:"▾ "}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
td{padding:6px 4px;border-top:1px solid var(--rule);vertical-align:top}
td:first-child{color:var(--faint);white-space:nowrap}
textarea{width:100%;min-height:80px;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:15px var(--body)}
.extra{margin-top:14px;border-radius:14px;background:var(--violet-soft);padding:12px 14px}
.extra h4{margin:0 0 4px;font:700 15px var(--display);color:var(--violet)}
.extra .lock{font-size:14px;color:var(--ink2)}
.xrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(122,76,194,.18)}
.xrow:first-of-type{border-top:0}
.xrow .chk{width:24px;height:24px;border-width:2px;font-size:12px}
.xrow.done .chk{background:var(--violet);border-color:var(--violet)}
.xrow .tt{font-weight:700;font-size:14px}
.xrow .mm{font-size:13px;color:var(--ink2)}

/* ---------- semana ---------- */
.wkhead{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}
.wkhead h3{font-size:18px}
.wkbtn{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:18px}
.day{background:var(--card);border-radius:14px;padding:12px 14px;margin:8px 0}
.day.today{box-shadow:0 0 0 2.5px var(--route)}
.day.past{opacity:.6}
.dh{display:flex;justify-content:space-between;align-items:baseline}
.dh b{font-family:var(--display);font-size:16px}
.dh span{font-size:13px;color:var(--faint)}
.cls{display:inline-block;margin:6px 0 2px;background:var(--signal-soft);border-radius:8px;padding:3px 9px;font-size:13.5px;font-weight:700}
.it{font-size:14.5px;padding:4px 0;display:flex;gap:8px}
.it.done{color:var(--faint);text-decoration:line-through}
.it .h{margin-left:auto;color:var(--faint);font-size:13px;white-space:nowrap}
.empty{font-size:14px;color:var(--faint);padding:4px 0}

/* ---------- barra inferior ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--rule);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12.5px;font-weight:700;color:var(--faint);border-radius:12px}
.tabs button .i{font-size:21px;line-height:1}
.tabs button.on{color:var(--route);background:var(--route-soft)}

/* ---------- hojas y modales ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,16,30,.45);display:none;align-items:flex-end;justify-content:center}
.veil.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:600px){.veil{align-items:center}.sheet{border-radius:24px}}
.sheet h2{font-size:24px;line-height:1.2;margin-bottom:6px}
.sheet p.lead{color:var(--ink2);margin:0 0 16px}
.dots{display:flex;gap:6px;margin-bottom:16px}
.dots i{width:28px;height:5px;border-radius:3px;background:var(--rule)}
.dots i.on{background:var(--route)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;border:2px solid var(--rule);background:var(--card)}
.opt.sel{border-color:var(--route);background:var(--route-soft)}
.opt .n{width:34px;height:34px;flex:0 0 auto;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:800 15px var(--display)}
.opt.sel .n{background:var(--route);color:#fff}
.opt .tt{font-weight:700}
.opt .mm{font-size:13px;color:var(--faint)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid5 .opt{justify-content:center;flex-direction:column;gap:2px;padding:12px 4px;margin:0}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--paper);margin:8px 0}
.stepper .lbl b{display:block}
.stepper .lbl span{font-size:13px;color:var(--faint)}
.stepper .ctl{display:flex;align-items:center;gap:12px}
.stepper .ctl button{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:700}
.stepper .ctl output{font:800 20px var(--display);min-width:48px;text-align:center}
.navrow{display:flex;gap:10px;margin-top:18px}
.navrow .ghost{margin:0;width:auto;flex:0 0 auto;padding:0 16px}
.sgroup{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.sgroup h3{font-size:16px;margin-bottom:6px}
.field{width:100%;padding:11px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:15px var(--body);margin:5px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.plain{display:inline-block;padding:9px 14px;border-radius:12px;background:var(--paper);font-weight:700;font-size:14px;margin:4px 6px 4px 0}
.plain.red{color:var(--danger)}
.celebrate{text-align:center}
.celebrate .boom{font-size:56px;line-height:1;margin:8px 0}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:30;background:var(--ink);color:var(--paper);padding:11px 8px 11px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-size:14.5px;transition:all .25s;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--signal);font-weight:700;padding:4px 10px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Ruta Macro Internacional<small id="todayLbl"></small></div>
    <button class="iconbtn" data-act="settings" aria-label="Ajustes">⚙︎</button>
  </header>
  <div id="line"></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-act="tab" data-tab="now" class="on"><span class="i">◉</span>Ahora</button>
  <button data-act="tab" data-tab="route"><span class="i">⟟</span>Ruta</button>
  <button data-act="tab" data-tab="week"><span class="i">▦</span>Semana</button>
</div></nav>

<div class="veil" id="veil"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button data-act="undo">Deshacer</button></div>

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const Q=new URLSearchParams(location.search);
const TODAY=Q.get("hoy")||ymd(new Date());
const toDate=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d)};
const diff=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const fmt=(s,o)=>toDate(s).toLocaleDateString("es-CL",o||{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");
const fmtLong=s=>fmt(s,{weekday:"long",day:"numeric",month:"long"});
const hrs=n=>(Math.round(n*10)/10).toString().replace(".",",")+" h";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const prepDeadline=m=>m.start>="12:00"?m.date:addDays(m.date,-1);
function when(s){const n=diff(TODAY,s);if(n===0)return"hoy";if(n===1)return"mañana";if(n===-1)return"ayer";return n>1?fmt(s):"hace "+(-n)+" días";}

/* =========================================================
   TAREAS Y PLAN AUTOMÁTICO
   ========================================================= */
function allTasks(){
  const out=[];
  MODS.forEach(m=>{
    const dl=prepDeadline(m); let i=0;
    m.tasks.forEach(t=>{
      const o={id:t[0],type:t[1],title:t[2],ref:t[3],h:t[4],note:t[5]||"",mod:m.id,ord:m.id*100+(i++)*2+1,how:TYPES[t[1]].how};
      if(o.type==="clase"){o.fixed=m.date;o.earliest=o.deadline=m.date;}
      else if(o.type==="post"){o.earliest=addDays(m.date,1);o.deadline=addDays(m.date,3);}
      else{o.earliest="2026-09-01";o.deadline=dl;}
      out.push(o);
    });
    if(+S.group===m.group&&m.group){
      GROUP_STEPS.forEach((g,k)=>out.push({id:"g"+m.group+"-"+g[0],type:"grupo",title:g[1],ref:"Grupo "+m.group,h:g[2],how:g[3],note:"",mod:m.id,ord:m.id*100+k*2+2,earliest:addDays(m.date,-14),deadline:dl}));
    }
  });
  S.custom.forEach(c=>out.push({id:c.id,type:"custom",title:c.title,ref:"",h:+c.h||0,how:[],note:"",mod:+c.mod,ord:99999,fixed:c.date,earliest:c.date,deadline:c.date}));
  return out;
}
function capOf(d){
  const w=toDate(d).getDay(), we=w===0||w===6;
  let c=we?S.cap.we:S.cap.wd;
  const cls=MODS.find(m=>m.date===d);
  if(cls) c=cls.start>="12:00"?Math.min(c,2):Math.floor(c/2);
  return c;
}
let P=null;
function buildPlan(){
  const T=allTasks(),plan={},late={},over={},used={},last={};
  T.forEach(t=>{if(!S.done[t.id]&&t.fixed)plan[t.id]=t.fixed;});
  T.filter(t=>!S.done[t.id]&&!t.fixed)
   .sort((a,b)=>a.deadline.localeCompare(b.deadline)||a.ord-b.ord)
   .forEach(t=>{
     const key=t.mod+(t.type==="post"?"p":"");
     let start=[TODAY,t.earliest,last[key]||TODAY].sort().pop(), day=null;
     if(t.deadline<TODAY){day=TODAY;late[t.id]=1;}
     else{
       if(start>t.deadline)start=t.deadline;
       for(let d=start;d<=t.deadline;d=addDays(d,1)){const c=capOf(d),u=used[d]||0;if(c<=0)continue;if(u+t.h<=c+1e-9||u===0){day=d;break;}}
       if(!day){let best=null;for(let d=start;d<=t.deadline;d=addDays(d,1)){const r=(used[d]||0)-capOf(d);if(!best||r<best.r)best={d,r};}day=best?best.d:t.deadline;over[t.id]=1;}
     }
     plan[t.id]=day;used[day]=(used[day]||0)+t.h;last[key]=day;
   });
  P={T,plan,late,over,used};
}
const modTasks=id=>P.T.filter(t=>t.mod===id);
function modPct(id){const l=modTasks(id),tot=l.reduce((a,t)=>a+t.h,0),d=l.filter(t=>S.done[t.id]).reduce((a,t)=>a+t.h,0);return tot?Math.round(100*d/tot):0;}
const nextMod=()=>MODS.find(m=>m.date>=TODAY);
function todayQueue(){
  return P.T.filter(t=>!S.done[t.id]&&P.plan[t.id]===TODAY)
    .sort((a,b)=>(P.late[b.id]?1:0)-(P.late[a.id]?1:0)||(S.later[a.id]===TODAY?1:0)-(S.later[b.id]===TODAY?1:0)||a.deadline.localeCompare(b.deadline)||a.ord-b.ord);
}
function nextAhead(){return P.T.filter(t=>!S.done[t.id]&&t.type!=="clase"&&t.type!=="custom"&&P.plan[t.id]>TODAY).sort((a,b)=>P.plan[a.id].localeCompare(P.plan[b.id])||a.ord-b.ord)[0];}

function renderLine(){
  const nm=nextMod(); let doneN=0;
  for(const m of MODS){if(modPct(m.id)===100)doneN++;else break;}
  const w=(Math.min(doneN,5)/5)*(100*10/12);
  document.getElementById("line").innerHTML='<div class="line" role="list" aria-label="Módulos del curso"><div class="track"></div><div class="fill" style="width:'+w+'%"></div>'+
    MODS.map(m=>{const p=modPct(m.id),st=p===100?"done":(nm&&nm.id===m.id?"cur":"");
      return '<button class="stn '+st+'" role="listitem" data-act="goto" data-mod="'+m.id+'" aria-label="Módulo '+m.id+', '+m.title+', '+p+'% completo">'+
      (st==="cur"?'<span class="here">Estás aquí</span>':"")+'<span class="dot">'+(p===100?"✓":m.id)+'</span><span class="nm">'+m.short+'</span><span class="dt">'+fmt(m.date,{day:"numeric",month:"short"}).replace(/\./g,"")+'</span></button>';}).join("")+'</div>';
}

function countdown(m){
  const [hh,mm]=m.start.split(":").map(Number);
  const t=toDate(m.date);t.setHours(hh,mm,0,0);
  const ms=t-new Date();
  if(Q.get("hoy")){const n=diff(TODAY,m.date);return n<=0?"hoy":n+(n===1?" día":" días");}
  if(ms<=0)return ms>-5*3600e3?"ahora":"hoy";
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);
  return d>0?d+" d "+h+" h":h>0?h+" h":Math.max(1,Math.round(ms/6e4))+" min";
}

function viewNow(){
  const nm=nextMod(); let html="";
  if(nm){
    const isGroup=+S.group===nm.group;
    html+='<div class="next"><div class="big">'+countdown(nm)+'</div><div class="txt">para la clase del <b>módulo '+nm.id+'</b>, '+fmtLong(nm.date).split(",")[0]+' '+nm.when.split(" ")[1]+', sala <b>'+nm.room+'</b>'+(isGroup?'. <b>Presenta tu grupo.</b>':'')+'</div></div>';
  }
  html+=noticesHTML(nm);
  const q=todayQueue();
  const focus=q[0]||nextAhead();
  if(focus) html+=focusHTML(focus,q.length?{pos:1,total:q.length}:null);
  else html+='<div class="focus celebrate"><div class="boom">🏁</div><h2>Terminaste la ruta del curso</h2><p class="why">Si hay pruebas finales, agrégalas en Ajustes y la guía armará el repaso.</p></div>';

  if(q.length>1){
    const usedToday=P.used[TODAY]||0,cap=capOf(TODAY);
    html+='<div class="sec"><h3>También para hoy</h3><span>'+hrs(usedToday)+' de '+hrs(cap)+' disponibles</span></div>'+
      '<div class="load'+(usedToday>cap?" over":"")+'"><i style="width:'+Math.min(100,100*usedToday/Math.max(cap,.1))+'%"></i></div>'+
      q.slice(1).map(t=>rowHTML(t)).join("");
  }
  const up=P.T.filter(t=>!S.done[t.id]&&t.type!=="clase"&&P.plan[t.id]>TODAY).sort((a,b)=>P.plan[a.id].localeCompare(P.plan[b.id])||a.ord-b.ord).filter(t=>!focus||t.id!==focus.id).slice(0,3);
  if(up.length) html+='<div class="sec"><h3>Lo que viene</h3><span>reorganizado según tus horas</span></div>'+up.map(t=>rowHTML(t,true)).join("");
  return html;
}

function noticesHTML(nm){
  const out=[];
  const late=P.T.filter(t=>P.late[t.id]);
  if(late.length) out.push(["danger","⏰","Tienes <b>"+late.length+" paso"+(late.length>1?"s":"")+" atrasado"+(late.length>1?"s":"")+"</b>. Los puse primero en tu lista de hoy."]);
  if(nm){
    const dl=prepDeadline(nm);
    const need=P.T.filter(t=>t.mod===nm.id&&!S.done[t.id]&&!["clase","post","custom"].includes(t.type)).reduce((a,t)=>a+t.h,0);
    let avail=0;for(let d=TODAY;d<=dl;d=addDays(d,1))avail+=capOf(d);
    if(need>avail+0.01) out.push(["signal","⚡","Te faltan <b>"+hrs(need)+"</b> de preparación y tienes <b>"+hrs(avail)+"</b> hasta la clase. Sigue el orden: lo más importante va primero, y lo que no alcances pasa a después de clase.",'<div class="acts"><button class="pill" data-act="capup">+1 h por día</button></div>']);
    if(nm.warn&&nm.alert&&diff(TODAY,nm.date)<=3) out.push(["signal","📌",nm.warn]);
  }
  if(!S.group) out.push(["signal","👥","¿Cuál es tu grupo de presentación? Con ese dato la guía programa tu preparación.",'<div class="acts"><button class="pill" data-act="settings">Elegir grupo</button></div>']);
  return out.slice(0,2).map(n=>'<div class="notice '+n[0]+'"><span class="ic">'+n[1]+'</span><div>'+n[2]+(n[3]||"")+'</div></div>').join("");
}

function focusHTML(t,pos){
  const T=TYPES[t.type],m=MODS.find(x=>x.id===t.mod);
  const ahead=!pos;
  const facts=[];
  if(t.h)facts.push('<span class="fact">⏱ '+hrs(t.h)+'</span>');
  if(t.ref&&t.type!=="grupo")facts.push('<span class="fact">📚 '+esc(t.ref)+'</span>');
  if(t.type!=="clase"&&t.type!=="custom")facts.push('<span class="fact">Listo antes del '+fmt(t.deadline)+'</span>');
  if(P.late[t.id])facts.push('<span class="fact late">Atrasado</span>');
  return '<article class="focus" style="--tcol:'+T.col+'">'+
    '<div class="frow"><span class="kind">'+T.icon+' '+T.name+'</span><span>'+(ahead?'Para adelantar':'Paso '+pos.pos+' de '+pos.total+' hoy')+'</span></div>'+
    '<h2>'+esc(t.title)+'</h2><div class="facts">'+facts.join("")+'</div>'+
    '<p class="why"><b>Para qué:</b> '+T.why+(t.type==="lectura"||t.type==="caso"?' Módulo '+m.id+', '+m.title+'.':'')+'</p>'+
    (t.how.length?'<ol class="how">'+t.how.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>':"")+
    (t.note?'<div class="guide"><b>Preguntas guía.</b> '+esc(t.note)+'</div>':"")+
    (t.id==="m3-sgu7"?'<div class="guide"><b>Ojo.</b> '+esc(MODS[2].warn)+'</div>':"")+
    '<button class="cta'+(ahead?" blue":"")+'" data-act="done" data-id="'+t.id+'">✓ Terminé este paso</button>'+
    (!ahead&&pos.total>1?'<button class="ghost" data-act="later" data-id="'+t.id+'">Hacerlo más tarde hoy</button>':"")+
  '</article>';
}

function rowHTML(t,showDay){
  const d=!!S.done[t.id],T=TYPES[t.type];
  return '<div class="rowt'+(d?" done":"")+'"><button class="chk" data-act="done" data-id="'+t.id+'" aria-label="Marcar como hecho">'+(d?"✓":"")+'</button>'+
   '<div class="grow"><div class="tt">'+esc(t.title)+'</div><div class="mm">'+T.icon+' '+T.name+(t.h?', '+hrs(t.h):'')+(showDay?', '+when(P.plan[t.id]):'')+(P.late[t.id]?', atrasado':'')+'</div></div></div>';
}

function viewRoute(){
  const nm=nextMod();
  let html='<div class="sec"><h3>Toda la ruta</h3><span>toca un módulo para ver sus pasos</span></div>';
  MODS.forEach(m=>{
    const p=modPct(m.id),st=p===100?"done":(nm&&nm.id===m.id?"cur":"");
    const open=OPEN===null?(nm&&nm.id===m.id):OPEN===m.id;
    const l=modTasks(m.id),nd=l.filter(t=>S.done[t.id]).length;
    html+='<section class="mod '+st+(open?" open":"")+'" id="mod'+m.id+'"><button class="mh" data-act="open" data-mod="'+m.id+'" aria-expanded="'+open+'"><span class="num">'+(p===100?"✓":m.id)+'</span>'+
      '<div style="flex:1;min-width:0"><div class="t">'+m.title+'</div><div class="s">'+fmt(m.date)+', '+m.when.split(" ")[1]+', sala '+m.room+' · '+nd+' de '+l.length+' pasos</div><div class="bar"><i style="width:'+p+'%"></i></div></div><span class="chev">›</span></button>';
    if(open) html+='<div class="mb">'+modBody(m,p)+'</div>';
    html+='</section>';
  });
  html+='<details class="more" style="margin-top:20px"><summary>Bibliografía del curso</summary>'+BOOKS.map(b=>'<p style="margin:8px 0;font-size:14px"><b>'+b[0]+'</b>: '+b[1]+'</p>').join("")+'</details>';
  return html;
}

function modBody(m,p){
  const l=modTasks(m.id),dl=prepDeadline(m);
  const phases=[["Antes de la clase","listo antes del "+fmt(dl),l.filter(t=>!["clase","post","custom"].includes(t.type))],
    ["En clase",fmt(m.date)+", "+m.when.split(" ")[1],l.filter(t=>t.type==="clase")],
    ["Después de clase","hasta el "+fmt(addDays(m.date,3)),l.filter(t=>t.type==="post")]];
  const cus=l.filter(t=>t.type==="custom"); if(cus.length)phases.push(["Fechas propias","",cus]);
  let n=0;
  let h=(m.warn?'<div class="notice signal"><span class="ic">📌</span><div>'+m.warn+'</div></div>':"")+
    '<div class="chips"><span class="fact">Presenta el caso: '+m.presenter+(+S.group===m.group&&m.group?' (tú)':'')+'</span></div>';
  phases.forEach(ph=>{
    if(!ph[2].length)return;
    h+='<div class="phase">'+ph[0]+'<span>'+ph[1]+'</span></div><div class="steps">'+ph[2].map(t=>{
      n++;const d=!!S.done[t.id],T=TYPES[t.type],e=EXP[t.id];
      return '<div class="step'+(d?" done":"")+(e?" exp":"")+'"><button class="chk" data-act="done" data-id="'+t.id+'" aria-label="Marcar paso '+n+'">'+(d?"✓":n)+'</button>'+
        '<button class="sb" data-act="exp" data-id="'+t.id+'" aria-expanded="'+(!!e)+'"><div class="tt">'+esc(t.title)+'</div><div class="mm">'+T.icon+' '+T.name+(t.h?', '+hrs(t.h):'')+(!d&&P.plan[t.id]&&t.type!=="clase"?', toca '+when(P.plan[t.id]):'')+(P.late[t.id]&&!d?', atrasado':'')+'</div>'+
        '<div class="sx">'+T.why+(t.how.length?'<ol>'+t.how.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>':'')+(t.note?'<div class="guide"><b>Preguntas guía.</b> '+esc(t.note)+'</div>':'')+'</div></button>'+
        (t.type==="custom"?'<button class="plain red" data-act="delc" data-id="'+t.id+'">Quitar</button>':'')+'</div>';
    }).join("")+'</div>';
  });
  h+='<div class="navrow" style="margin-top:12px">'+(p<100?'<button class="plain" data-act="all" data-mod="'+m.id+'">Marcar todo el módulo como hecho</button>':'<button class="plain" data-act="none" data-mod="'+m.id+'">Desmarcar el módulo</button>')+'</div>';
  h+='<details class="more"><summary>Horario de las sesiones</summary><table>'+m.sessions.map(s=>'<tr><td>'+s[0]+'</td><td>'+s[1]+'<br><span style="color:var(--faint)">'+s[2]+'</span></td></tr>').join("")+'</table></details>';
  h+='<details class="more"><summary>Mis notas y dudas</summary><textarea data-note="'+m.id+'" placeholder="Dudas para el profesor, ideas clave…">'+esc(S.notes[m.id]||"")+'</textarea></details>';
  h+=extraHTML(m,p);
  return h;
}

function extraHTML(m,p){
  let h='<div class="extra"><h4>Ir más allá</h4>';
  if(p<100){const left=modTasks(m.id).filter(t=>!S.done[t.id]).length;
    return h+'<div class="lock">🔒 Material optativo para profundizar. Se abre cuando completes el módulo: te '+(left===1?'falta 1 paso':'faltan '+left+' pasos')+'.</div></div>';}
  h+='<div class="lock" style="margin-bottom:6px">Optativo. Elige lo que te interese.</div>';
  return h+m.beyond.map((b,i)=>{const id="x"+m.id+"-"+i,d=!!S.extra[id];
    return '<div class="xrow'+(d?" done":"")+'"><button class="chk" data-act="xdone" data-id="'+id+'" aria-label="Marcar">'+(d?"✓":"")+'</button><div><div class="tt">'+esc(b[0])+'</div><div class="mm">'+esc(b[1])+'</div></div></div>';}).join("")+'</div>';
}

function viewWeek(){
  const t=toDate(TODAY);const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7)+WEEK*7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return ymd(d);});
  let html='<div class="wkhead"><button class="wkbtn" data-act="wk" data-d="-1" aria-label="Semana anterior">‹</button><h3>'+(WEEK===0?'Esta semana':WEEK===1?'Próxima semana':'Semana del '+fmt(days[0],{day:"numeric",month:"short"}))+'</h3><button class="wkbtn" data-act="wk" data-d="1" aria-label="Semana siguiente">›</button></div>';
  html+='<p class="why" style="margin:0 0 6px;font-size:14px">El plan se recalcula solo cada vez que marcas un paso o cambias tus horas.</p>';
  days.forEach(d=>{
    const items=P.T.filter(x=>(!S.done[x.id]&&P.plan[x.id]===d)||(S.done[x.id]===d)).filter(x=>x.type!=="clase").sort((a,b)=>a.ord-b.ord);
    const cls=MODS.find(m=>m.date===d);
    if(d<TODAY&&!items.length&&!cls)return;
    const used=items.filter(x=>!S.done[x.id]).reduce((a,x)=>a+x.h,0),cap=capOf(d);
    html+='<div class="day'+(d===TODAY?" today":"")+(d<TODAY?" past":"")+'"><div class="dh"><b>'+fmt(d,{weekday:"long",day:"numeric"})+(d===TODAY?' (hoy)':'')+'</b><span'+(used>cap+0.01?' style="color:var(--danger);font-weight:700"':'')+'>'+(d>=TODAY?hrs(used)+' de '+hrs(cap):'')+'</span></div>'+
      (cls?'<span class="cls">🎓 Clase módulo '+cls.id+', '+cls.start+', '+cls.room+'</span>':'')+
      (items.length?items.map(x=>'<div class="it'+(S.done[x.id]?" done":"")+'"><span>'+TYPES[x.type].icon+'</span><span>'+esc(x.title)+'</span><span class="h">'+hrs(x.h)+'</span></div>').join(""):(cls?'':'<div class="empty">'+(d<TODAY?'—':'Libre')+'</div>'))+'</div>';
  });
  return html;
}

/* =========================================================
   HOJAS: configuración inicial, ajustes, celebración
   ========================================================= */
let OB={step:0,mod:null};
function openSheet(html){document.getElementById("sheet").innerHTML=html;document.getElementById("veil").classList.add("show");}
function closeSheet(){document.getElementById("veil").classList.remove("show");}

function onboardHTML(){
  const s=OB.step,dots='<div class="dots">'+[0,1,2].map(i=>'<i class="'+(i<=s?"on":"")+'"></i>').join("")+'</div>';
  if(OB.mod===null){const nm=nextMod();OB.mod=nm?nm.id:6;}
  if(s===0) return dots+'<h2>¿En qué módulo vas?</h2><p class="lead">Marco como hechos los módulos anteriores y la guía parte desde ahí.</p>'+
    MODS.map(m=>'<button class="opt'+(OB.mod===m.id?" sel":"")+'" data-act="obmod" data-mod="'+m.id+'"><span class="n">'+m.id+'</span><span><span class="tt">'+m.title+'</span><br><span class="mm">Clase el '+fmt(m.date)+'</span></span></button>').join("")+
    '<div class="navrow"><button class="cta blue" data-act="obnext">Siguiente</button></div>';
  if(s===1) return dots+'<h2>¿Cuánto tiempo tienes para estudiar?</h2><p class="lead">Con esto reparto las lecturas en tus días. Puedes cambiarlo cuando quieras.</p>'+
    stepperHTML("wd","De lunes a viernes","horas por día")+stepperHTML("we","Sábado y domingo","horas por día")+
    '<div class="navrow"><button class="ghost" data-act="obback">Atrás</button><button class="cta blue" data-act="obnext">Siguiente</button></div>';
  return dots+'<h2>¿Qué grupo eres?</h2><p class="lead">Cada grupo presenta un caso. La guía programará tu preparación con dos semanas de anticipación.</p>'+
    '<div class="grid5">'+[1,2,3,4,5].map(g=>{const m=MODS.find(x=>x.group===g);return '<button class="opt'+(+S.group===g?" sel":"")+'" data-act="grp" data-g="'+g+'"><span class="n">'+g+'</span><span class="mm">'+fmt(m.date,{day:"numeric",month:"short"})+'</span></button>';}).join("")+'</div>'+
    '<button class="opt'+(!S.group?" sel":"")+'" data-act="grp" data-g="0" style="justify-content:center">Todavía no lo sé</button>'+
    '<div class="navrow"><button class="ghost" data-act="obback">Atrás</button><button class="cta" data-act="obfinish">Empezar</button></div>';
}
function stepperHTML(k,lbl,sub){return '<div class="stepper"><div class="lbl"><b>'+lbl+'</b><span>'+sub+'</span></div><div class="ctl"><button data-act="cap" data-k="'+k+'" data-d="-0.5" aria-label="Menos">−</button><output>'+hrs(S.cap[k])+'</output><button data-act="cap" data-k="'+k+'" data-d="0.5" aria-label="Más">+</button></div></div>';}

function settingsHTML(){
  return '<h2>Ajustes</h2>'+
   '<div class="sgroup"><h3>Tiempo de estudio</h3>'+stepperHTML("wd","De lunes a viernes","horas por día")+stepperHTML("we","Sábado y domingo","horas por día")+'</div>'+
   '<div class="sgroup"><h3>Mi grupo de presentación</h3><div class="grid5">'+[1,2,3,4,5].map(g=>'<button class="opt'+(+S.group===g?" sel":"")+'" data-act="grp" data-g="'+g+'"><span class="n">'+g+'</span><span class="mm">Mód. '+MODS.find(x=>x.group===g).id+'</span></button>').join("")+'</div>'+
   '<button class="opt'+(!S.group?" sel":"")+'" data-act="grp" data-g="0" style="justify-content:center">Todavía no lo sé</button></div>'+
   '<div class="sgroup"><h3>Agregar una prueba o fecha</h3><p class="why" style="font-size:14px;margin:0">Para evaluaciones que no estén en la planificación.</p>'+
   '<input class="field" id="cT" placeholder="Ej.: Prueba 1"><div class="two"><input class="field" type="date" id="cD" value="'+TODAY+'"><select class="field" id="cM">'+MODS.map(m=>'<option value="'+m.id+'">Módulo '+m.id+'</option>').join("")+'</select></div>'+
   '<button class="plain" data-act="addc">Agregar fecha</button></div>'+
   '<div class="sgroup"><h3>Respaldo</h3><p class="why" style="font-size:14px;margin:0 0 6px">Tu avance se guarda en este navegador. Descárgalo para pasarlo del computador al celular.</p>'+
   '<button class="plain" data-act="exp">Descargar avance</button><label class="plain" style="cursor:pointer">Cargar avance<input type="file" id="imp" accept=".json" class="hidden"></label></div>'+
   '<div class="sgroup"><button class="plain" data-act="theme">Cambiar tema claro u oscuro</button><button class="plain" data-act="reob">Repetir configuración inicial</button><button class="plain red" data-act="reset">Borrar todo mi avance</button></div>'+
   '<div class="navrow"><button class="cta blue" data-act="close">Listo</button></div>';
}

function celebrateHTML(m){
  return '<div class="celebrate"><div class="boom">🎉</div><h2>¡Módulo '+m.id+' completo!</h2><p class="lead">'+m.title+'. Se desbloqueó el material optativo para ir más allá.</p>'+
   '<button class="cta" data-act="seeextra" data-mod="'+m.id+'">Ver material optativo</button><button class="ghost" data-act="close">Seguir con la ruta</button></div>';
}

/* =========================================================
   ACCIONES
   ========================================================= */
let UNDO=null,toastT=null;
function toast(msg,undo){UNDO=undo;document.getElementById("toastMsg").textContent=msg;const t=document.getElementById("toast");t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),4500);}
function toggleDone(id){
  buildPlan();
  const t=P.T.find(x=>x.id===id); if(!t)return;
  const before=modPct(t.mod), was=S.done[id];
  if(was) delete S.done[id]; else S.done[id]=TODAY;
  save(); render();
  if(!was){
    toast("Paso completado",()=>{delete S.done[id];save();render();});
    if(before<100&&modPct(t.mod)===100) openSheet(celebrateHTML(MODS.find(m=>m.id===t.mod)));
  }
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,mod=+b.dataset.mod;
  switch(a){
    case"tab": TAB=b.dataset.tab; render(); scrollTo(0,0); break;
    case"done": toggleDone(id); break;
    case"later": S.later[id]=TODAY; save(); render(); break;
    case"xdone": S.extra[id]=!S.extra[id]; save(); render(); break;
    case"goto": TAB="route"; OPEN=mod; render(); setTimeout(()=>{const el=document.getElementById("mod"+mod);el&&el.scrollIntoView({behavior:"smooth",block:"start"});},30); break;
    case"open": OPEN=(OPEN===mod||(OPEN===null&&nextMod()&&nextMod().id===mod))?-1:mod; render(); break;
    case"exp": EXP[id]=!EXP[id]; render(); break;
    case"all": {const ids=modTasks(mod).filter(t=>!S.done[t.id]).map(t=>t.id); ids.forEach(i=>S.done[i]=TODAY); save(); render(); toast("Módulo "+mod+" marcado como hecho",()=>{ids.forEach(i=>delete S.done[i]);save();render();}); break;}
    case"none": modTasks(mod).forEach(t=>delete S.done[t.id]); save(); render(); break;
    case"wk": WEEK+=+b.dataset.d; render(); break;
    case"capup": S.cap.wd+=1; S.cap.we+=1; save(); render(); toast("Ahora: "+hrs(S.cap.wd)+" entre semana y "+hrs(S.cap.we)+" el fin de semana",null); break;
    case"cap": {const k=b.dataset.k; S.cap[k]=Math.max(0.5,Math.min(12,S.cap[k]+(+b.dataset.d))); save(); b.parentNode.querySelector("output").textContent=hrs(S.cap[k]); render(); break;}
    case"grp": S.group=+b.dataset.g; save(); render(); document.getElementById("sheet").innerHTML=S.onboarded?settingsHTML():onboardHTML(); break;
    case"settings": openSheet(settingsHTML()); break;
    case"close": closeSheet(); break;
    case"undo": if(UNDO){UNDO();UNDO=null;} document.getElementById("toast").classList.remove("show"); break;
    case"obmod": OB.mod=mod; document.getElementById("sheet").innerHTML=onboardHTML(); break;
    case"obnext": OB.step++; document.getElementById("sheet").innerHTML=onboardHTML(); break;
    case"obback": OB.step--; document.getElementById("sheet").innerHTML=onboardHTML(); break;
    case"obfinish": {buildPlan(); P.T.filter(t=>t.mod<OB.mod).forEach(t=>{if(!S.done[t.id])S.done[t.id]="previo";}); S.onboarded=true; save(); closeSheet(); TAB="now"; render(); break;}
    case"reob": S.onboarded=false; OB={step:0,mod:null}; save(); openSheet(onboardHTML()); break;
    case"seeextra": closeSheet(); TAB="route"; OPEN=mod; render(); setTimeout(()=>{const el=document.querySelector("#mod"+mod+" .extra");el&&el.scrollIntoView({behavior:"smooth",block:"center"});},30); break;
    case"addc": {const ti=document.getElementById("cT").value.trim(); if(!ti){document.getElementById("cT").focus();return;}
      S.custom.push({id:"c"+Date.now(),title:ti,date:document.getElementById("cD").value||TODAY,h:0,mod:+document.getElementById("cM").value}); save(); render(); document.getElementById("cT").value=""; toast("Fecha agregada a la ruta",null); break;}
    case"delc": S.custom=S.custom.filter(c=>c.id!==id); save(); render(); break;
    case"exp": {const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const l=document.createElement("a");l.href=URL.createObjectURL(blob);l.download="avance-macro-"+TODAY+".json";l.click();break;}
    case"theme": {const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark";try{localStorage.setItem(KEY+"-theme",r.dataset.theme)}catch(err){}break;}
    case"reset": if(confirm("Esto borra todo tu avance en este navegador. ¿Continuar?")){S=fresh();save();OB={step:0,mod:null};openSheet(onboardHTML());render();} break;
  }
});
document.addEventListener("input",e=>{if(e.target.dataset.note){S.notes[e.target.dataset.note]=e.target.value;save();}});
document.addEventListener("change",e=>{
  if(e.target.id==="imp"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{S=Object.assign(fresh(),JSON.parse(r.result));save();render();closeSheet();toast("Avance cargado",null);}catch(err){alert("Ese archivo no es un respaldo de esta guía.");}};r.readAsText(e.target.files[0]);}
});
document.getElementById("veil").addEventListener("click",e=>{if(e.target.id==="veil"&&S.onboarded)closeSheet();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.onboarded)closeSheet();});

try{const th=localStorage.getItem(KEY+"-theme");if(th)document.documentElement.dataset.theme=th;}catch(e){}
render();
if(!S.onboarded) openSheet(onboardHTML());
setInterval(()=>{if(TAB==="now"&&!document.getElementById("veil").classList.contains("show"))renderLine(),(document.querySelector(".next .big")&&(document.querySelector(".next .big").textContent=countdown(nextMod()||MODS[5])));},60000);
</script>
